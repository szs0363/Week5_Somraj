# environment.yml
# Create with:  conda env create -f environment.yml
# Activate with: conda activate week5-busco 
# BUSCO lineage dataset version too (see README "Reproducibility notes").
name: week5-busco
channels:
  - bioconda
  - conda-forge
dependencies:
  - python=3.11
  - busco=5.8.2
  - seqkit=2.8.2
  - ncbi-datasets-cli=16.30.0
